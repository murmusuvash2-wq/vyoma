name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name for a signed APK (for example 0.1.2)
        required: true
        default: 0.1.3
  push:
    branches:
      - main
      - "feature/approved-homepage-layout"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Validate stable signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is not configured. Refusing to create a debug-signed APK."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode stable release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Set build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version_name }}"
          else
            VERSION="0.1.3"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version_name: $VERSION"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PvyomaVersionName="${{ steps.version.outputs.name }}" -PvyomaVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare signed APK and checksum
        shell: bash
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk "release-output/Vyoma-${{ steps.version.outputs.name }}.apk"
          sha256sum "release-output/Vyoma-${{ steps.version.outputs.name }}.apk" > release-output/SHA256SUMS.txt
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/feature/approved-homepage-layout" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-output/Vyoma-latest-test.apk
            APK_SHA256="$(sha256sum release-output/Vyoma-latest-test.apk | awk '{print $1}')"
            printf '%s  %s\\n' "$APK_SHA256" "Vyoma-latest-test.apk" > release-output/SHA256SUMS-latest-test.txt
            printf '{\\n  "versionName": "%s",\\n  "versionCode": %s,\\n  "commit": "%s",\\n  "apkUrl": "https://github.com/murmusuvash2-wq/vyoma/releases/download/latest-test/Vyoma-latest-test.apk",\\n  "sha256": "%s"\\n}\\n' \
              "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$GITHUB_SHA" "$APK_SHA256" > release-output/latest-test.json
          fi

      - name: Upload signed APK artifact for testing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')
        uses: actions/upload-artifact@v4
        with:
          name: vyoma-signed-apk-${{ steps.version.outputs.name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

      # Mutable tag is intentionally limited to the testing channel. It always points
      # to the exact commit used for the latest feature-branch APK, never a production release.
      - name: Move latest-test channel tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-homepage-layout'
        shell: bash
        run: |
          git tag --force latest-test "$GITHUB_SHA"
          git push --force origin refs/tags/latest-test

      - name: Publish or update one-click latest test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-homepage-layout'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: Vyoma Latest Test Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-output/Vyoma-latest-test.apk
            release-output/SHA256SUMS-latest-test.txt
            release-output/latest-test.json
          body: |
            Automatically refreshed test APK from the feature/approved-homepage-layout branch.
            Source commit: ${{ github.sha }}
            This is a testing build, not a production release.
            Verify SHA-256 using SHA256SUMS-latest-test.txt.
            Android may ask you to confirm installation. This workflow does not silently install updates.

      - name: Publish GitHub Release for version tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Vyoma ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release-output/*
          body: |
            Signed APK build for Vyoma ${{ steps.version.outputs.name }}.
            Stable release signing is required; debug-signed fallback is disabled.
            SHA-256 checksum is included in SHA256SUMS.txt.
