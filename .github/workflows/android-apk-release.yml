name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name for a test APK (for example 0.1.1)
        required: false
        default: 0.1.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode stable release keystore
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Set build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version_name }}"
            VERSION="${VERSION:-0.1.1}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        run: gradle --no-daemon assembleRelease -PvyomaVersionName="${{ steps.version.outputs.name }}" -PvyomaVersionCode="${{ steps.version.outputs.code }}"

      - name: Build installable debug-signed APK (testing only)
        if: env.RELEASE_SIGNING_READY != 'true'
        run: gradle --no-daemon assembleDebug -PvyomaVersionName="${{ steps.version.outputs.name }}" -PvyomaVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare APK and signing note
        id: package
        working-directory: .
        shell: bash
        run: |
          mkdir -p release-output
          if [[ "$RELEASE_SIGNING_READY" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-output/Vyoma-${{ steps.version.outputs.name }}.apk"
            APK_PATH="release-output/Vyoma-${{ steps.version.outputs.name }}.apk"
            echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "signing=Stable release signing configured." >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-output/Vyoma-${{ steps.version.outputs.name }}-DEBUG.apk"
            APK_PATH="release-output/Vyoma-${{ steps.version.outputs.name }}-DEBUG.apk"
            echo "apk=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "signing=WARNING: debug-signed test APK. Do not use this build for upgrades across different CI runs; configure the stable signing secrets first." >> "$GITHUB_OUTPUT"
          fi
          sha256sum "$APK_PATH" > release-output/SHA256SUMS.txt

      - name: Upload APK artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vyoma-apk-${{ steps.version.outputs.name }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Vyoma ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release-output/*
          body: |
            APK build for Vyoma ${{ steps.version.outputs.name }}.

            Signing status: ${{ steps.package.outputs.signing }}

            SHA-256 checksum is included in SHA256SUMS.txt.
